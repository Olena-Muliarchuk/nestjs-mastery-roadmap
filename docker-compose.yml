version: '3.8'
services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
     # Left side (host port) from .env, right side (container port) always 5432
      - '${DB_PORT}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    ports:
      - '${REDIS_PORT}:6379'
    restart: always
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
